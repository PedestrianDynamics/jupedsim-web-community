name: Execute Notebooks (drift)

# Drift detection only: runs against the LATEST jupedsim-scenarios, not the
# locked version. Its output never feeds the published V&V site; the
# published results come from the notebooks job in vv.yml (locked
# environment).

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  execute-notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --frozen --extra dev

      - name: Upgrade jupedsim-scenarios to latest release
        # The notebook CI exists to catch API drift in jupedsim-scenarios;
        # uv.lock pins an older version, so override it on every run to
        # test against whatever is currently published on PyPI.
        run: uv sync --upgrade-package jupedsim-scenarios

      - name: Execute notebooks
        # --no-sync keeps the upgraded environment from the previous step.
        run: uv run --no-sync python scripts/run_notebooks.py

      - name: Notebook summary
        if: always()
        run: |
          if [ -f results/notebooks/summary.md ]; then
            cat results/notebooks/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload executed notebooks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-notebooks
          path: results/notebooks
          if-no-files-found: warn

      - name: Open issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let failedList = '(see workflow logs)';
            try {
              failedList = fs.readFileSync('results/notebooks/failed-notebooks.txt', 'utf8')
                .trim()
                .split('\n')
                .map(l => `- \`${l}\``)
                .join('\n');
            } catch (_) {}
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = 'Weekly notebook execution failed';
            const body = [
              'The scheduled notebook execution workflow failed.',
              '',
              '**Failed notebooks:**',
              failedList,
              '',
              `**Run:** ${runUrl}`,
              '',
              'Common causes: jupedsim-scenarios API change, dependency drift, or scenario regressions.',
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'notebook-ci',
            });
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['notebook-ci'],
              });
            }
