name: V&V Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # Weekly Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  vv-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Sync environment
      run: uv sync --frozen --extra dev

    - name: Run V&V tests
      run: uv run --frozen --extra dev python -m pytest tests/vv -v --junitxml=results/vv-tests.xml

    - name: Upload V&V test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: vv-test-results
        path: |
          results/vv-tests.xml
          results/vv-results.json
        if-no-files-found: warn

    - name: V&V test summary
      if: always()
      uses: test-summary/action@v2
      with:
        paths: results/vv-tests.xml

    # Build the standards coverage report (HTML dashboard + Markdown mirror)
    # from the manifest joined to the live JUnit results. Stdlib only.
    - name: Generate standards coverage report
      if: always()
      run: |
        python3 scripts/gen_standards_report.py --junit results/vv-tests.xml --outdir site
        cat site/summary.md >> "$GITHUB_STEP_SUMMARY"

    - name: Update pinned issue
      # Only push/schedule runs on main update the pinned tracking issue.
      # PR builds (especially from forks) have reduced GITHUB_TOKEN scope
      # and would either fail the PATCH or pollute the pinned issue with
      # in-flight PR results.
      if: always() && github.event_name != 'pull_request'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [ -f site/summary.md ]; then
          jq -n --rawfile body site/summary.md '{"body": $body}' | \
            curl -s -X PATCH \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -d @- \
              "https://api.github.com/repos/PedestrianDynamics/jupedsim-web-community/issues/67"
        fi

    - name: Upload dashboard
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: vv-dashboard
        path: site
        if-no-files-found: warn

  # Execute every standards notebook on the locked environment (uv.lock) so
  # that the published numbers and figures come from this one run. Skipped on
  # pull requests (runtime). Drift detection against the latest
  # jupedsim-scenarios lives in notebooks.yml.
  notebooks:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Sync environment
      run: uv sync --frozen --extra dev

    - name: Execute notebooks
      run: uv run --frozen python scripts/run_notebooks.py

    - name: Notebook summary
      if: always()
      run: |
        if [ -f results/notebooks/summary.md ]; then
          cat results/notebooks/summary.md >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload executed notebooks
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: executed-notebooks
        path: results/notebooks
        if-no-files-found: warn

  # Assemble the Pages site (main only): the dashboard plus the executed
  # notebooks from the same run.
  build-pages:
    needs: [vv-tests, notebooks]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
    - name: Download dashboard
      uses: actions/download-artifact@v4
      with:
        name: vv-dashboard
        path: site

    - name: Download executed notebooks
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: executed-notebooks
        path: site/notebooks

    - name: Link notebooks from the dashboard
      run: |
        if [ -f site/notebooks/manifest.json ]; then
          python3 - <<'PY'
        import pathlib
        p = pathlib.Path("site/index.html")
        link = '<p><a href="notebooks/manifest.json">Executed notebooks (manifest)</a></p>'
        p.write_text(p.read_text().replace("</body>", link + "</body>", 1))
        PY
        fi

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: site

  # Publish the dashboard to GitHub Pages (main only). Requires Pages to be
  # enabled with "GitHub Actions" as the source (Settings -> Pages).
  deploy-pages:
    needs: build-pages
    if: ${{ !cancelled() && needs.build-pages.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
