name: V&V Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      recompute:
        description: "Run tests and notebooks (false: build the site from the latest successful main run)"
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  issues: write
  pages: write
  id-token: write

# A newer pull request push supersedes the running one. Main pushes queue
# instead (only the newest pending one is kept): a page-only push that
# waits for a running recompute can then reuse its results, where
# cancelling it would force the next push to recompute. Dispatch runs
# have their own group and never cancel a main push run.
concurrency:
  group: "pages-${{ github.event_name }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decide whether this run recomputes the results. Pull requests always
  # do (they select their tests in vv-tests); a
  # dispatch follows its input; a main push recomputes only when the
  # changes since the commit of the latest successful main push run can
  # affect a V&V test or notebook (scripts/select_vv_tests.py), so a
  # page-only change rebuilds the site from those results. Diffing against
  # that commit, not the previous push, keeps a change whose run was
  # cancelled or failed in the next run's scope.
  scope:
    runs-on: ubuntu-latest
    outputs:
      recompute: ${{ steps.decide.outputs.recompute }}
    steps:
    - uses: actions/checkout@v4
      if: github.event_name == 'push'

    - name: Decide
      id: decide
      env:
        EVENT: ${{ github.event_name }}
        RECOMPUTE_INPUT: ${{ inputs.recompute }}
        GH_TOKEN: ${{ github.token }}
      run: |
        recompute=true
        if [ "$EVENT" = workflow_dispatch ]; then
          recompute=${RECOMPUTE_INPUT:-false}
        elif [ "$EVENT" = push ]; then
          out=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/vv.yml/runs?branch=main&event=push&status=success&per_page=1" \
            --jq '.workflow_runs[0] | "\(.id) \(.head_sha)"' || true)
          run_id=${out%% *} base=${out#* }
          # Reuse needs that run's results; once they have expired, recompute.
          live=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
            --jq '[.artifacts[] | select(.expired | not) | .name] | map(select(. == "vv-test-results" or . == "executed-notebooks")) | length' || echo 0)
          [ "$live" = 2 ] || base=
        fi
        if [ -n "${base:-}" ] && git fetch -q --depth=1 origin "$base" 2>/dev/null; then
          git diff --name-only --no-renames "$base" HEAD > "${{ runner.temp }}/changed.txt"
          echo "Files changed since ${base} (latest successful main run): $(wc -l < "${{ runner.temp }}/changed.txt")" >> "$GITHUB_STEP_SUMMARY"
          tests=$(python3 scripts/select_vv_tests.py "$base" HEAD < "${{ runner.temp }}/changed.txt")
          if [ -z "$tests" ] && ! grep -qx 'scripts/run_notebooks.py' "${{ runner.temp }}/changed.txt"; then
            recompute=false
          fi
        fi
        echo "recompute=$recompute" >> "$GITHUB_OUTPUT"
        echo "Recompute results: $recompute" >> "$GITHUB_STEP_SUMMARY"

  vv-tests:
    needs: scope
    if: needs.scope.outputs.recompute == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        # Pull requests diff the merge commit against its first parent.
        fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}

    - name: Select V&V tests
      id: select
      # Pull requests run only the tests their changes can affect
      # (scripts/select_vv_tests.py); every other event runs the full
      # suite, which is what gets published.
      run: |
        if [ "${{ github.event_name }}" = pull_request ]; then
          git diff --name-only --no-renames HEAD^1 HEAD > "${{ runner.temp }}/changed.txt"
          tests=$(python3 scripts/select_vv_tests.py HEAD^1 HEAD < "${{ runner.temp }}/changed.txt")
        else
          tests=tests/vv
        fi
        echo "tests=$tests" >> "$GITHUB_OUTPUT"
        echo "V&V tests selected: ${tests:-none}" >> "$GITHUB_STEP_SUMMARY"

    - uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Sync environment
      run: uv sync --frozen --extra dev

    - name: Run site generator and selector tests
      if: github.event_name == 'pull_request'
      run: uv run --frozen --extra dev python -m pytest tests/test_gen_vv_site.py tests/test_select_vv_tests.py -v

    - name: Run V&V tests
      if: steps.select.outputs.tests != ''
      run: uv run --frozen --extra dev python -m pytest ${{ steps.select.outputs.tests }} -v --junitxml=results/vv-tests.xml

    - name: Upload V&V test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: vv-test-results
        path: |
          results/vv-tests.xml
          results/vv-results.json
          results/vv-results-partial.json
        if-no-files-found: warn

    - name: V&V test summary
      if: always() && steps.select.outputs.tests != ''
      uses: test-summary/action@v2
      with:
        paths: results/vv-tests.xml

    # Build the standards coverage report (HTML dashboard + Markdown mirror)
    # from the manifest joined to the live JUnit results. Stdlib only.
    - name: Generate standards coverage report
      if: always() && steps.select.outputs.tests != ''
      run: |
        python3 scripts/gen_standards_report.py --junit results/vv-tests.xml --outdir site
        cat site/summary.md >> "$GITHUB_STEP_SUMMARY"

    - name: Update pinned issue
      # Only push runs on main update the pinned tracking issue.
      # PR builds (especially from forks) have reduced GITHUB_TOKEN scope
      # and would either fail the PATCH or pollute the pinned issue with
      # in-flight PR results.
      if: always() && github.event_name != 'pull_request'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [ -f site/summary.md ]; then
          jq -n --rawfile body site/summary.md '{"body": $body}' | \
            curl -s -X PATCH \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -d @- \
              "https://api.github.com/repos/PedestrianDynamics/jupedsim-web-community/issues/67"
        fi

    - name: Upload dashboard
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: vv-dashboard
        path: site
        if-no-files-found: warn

  # Execute every standards notebook on the locked environment (uv.lock) so
  # that the published numbers and figures come from this one run. Skipped on
  # pull requests (runtime). Drift detection against the latest
  # jupedsim-scenarios lives in notebooks.yml.
  notebooks:
    needs: scope
    if: github.event_name != 'pull_request' && needs.scope.outputs.recompute == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Sync environment
      run: uv sync --frozen --extra dev

    - name: Execute notebooks
      # Two at a time: on the 4-vCPU runner, four heavy notebooks side by side
      # (RiMEA 4 and 12a, ISO 6 and 15) each exceeded 30 min. The runtime work
      # item in the V&V plan removes the double computation behind this.
      run: uv run --frozen python scripts/run_notebooks.py --jobs 2 --timeout 3600

    - name: Notebook summary
      if: always()
      run: |
        if [ -f results/notebooks/summary.md ]; then
          cat results/notebooks/summary.md >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload executed notebooks
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: executed-notebooks
        path: results/notebooks
        if-no-files-found: warn

  # Assemble the Pages site (main only): the dashboard plus the executed
  # notebooks from the same run.
  build-pages:
    # Builds the Hugo site from this run's test results and executed
    # notebooks. Runs on main pushes (deployed) and on manual dispatch
    # (artifact only, for previewing a branch; without recompute it uses
    # the latest successful main run's results).
    needs: [scope, vv-tests, notebooks]
    if: ${{ !cancelled() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.144.0
    steps:
    - uses: actions/checkout@v4

    - uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Sync environment
      run: uv sync --frozen --extra dev

    # Without recompute (a dispatch preview or a page-only main push) the
    # site is built over the results of the latest successful push run on
    # main. The provenance (commit, run ID) is written into those results
    # when they are computed, so the page names that run, not this one.
    - name: Find latest main results
      id: source
      if: needs.scope.outputs.recompute != 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        out=$(gh api \
          "repos/${GITHUB_REPOSITORY}/actions/workflows/vv.yml/runs?branch=main&event=push&status=success&per_page=1" \
          --jq '.workflow_runs[0] | "\(.id) \(.head_sha)"')
        run_id=${out%% *} sha=${out#* }
        if [ -z "$run_id" ] || [ "$run_id" = null ]; then
          echo "no successful main push run of vv.yml found" >&2
          exit 1
        fi
        echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
        echo "Results from main run ${run_id} (commit ${sha})" >> "$GITHUB_STEP_SUMMARY"

    - name: Download test results
      if: steps.source.outputs.run_id == ''
      uses: actions/download-artifact@v4
      with:
        name: vv-test-results
        path: results

    - name: Download executed notebooks
      if: steps.source.outputs.run_id == ''
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: executed-notebooks
        path: results/notebooks

    - name: Download test results (latest main)
      if: steps.source.outputs.run_id != ''
      uses: actions/download-artifact@v4
      with:
        name: vv-test-results
        path: results
        run-id: ${{ steps.source.outputs.run_id }}
        github-token: ${{ github.token }}

    - name: Download executed notebooks (latest main)
      if: steps.source.outputs.run_id != ''
      uses: actions/download-artifact@v4
      with:
        name: executed-notebooks
        path: results/notebooks
        run-id: ${{ steps.source.outputs.run_id }}
        github-token: ${{ github.token }}

    # Carry the reused results forward: a page-only main push becomes the
    # latest successful main run, so the next one finds them here.
    - name: Re-upload test results
      if: steps.source.outputs.run_id != ''
      uses: actions/upload-artifact@v4
      with:
        name: vv-test-results
        path: results/vv-*.*
        if-no-files-found: error

    - name: Re-upload executed notebooks
      if: steps.source.outputs.run_id != ''
      uses: actions/upload-artifact@v4
      with:
        name: executed-notebooks
        path: results/notebooks
        if-no-files-found: error

    - uses: actions/setup-go@v5
      with:
        go-version: "1.22"

    - name: Install Hugo
      run: |
        wget -q -O "${{ runner.temp }}/hugo.deb" \
          "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
        sudo dpkg -i "${{ runner.temp }}/hugo.deb"

    - name: Generate site content
      run: |
        args=(--manifest standards/coverage.json --definitions standards/definitions.json --hugo-content site/content)
        [ -f results/vv-results.json ] && args+=(--results results/vv-results.json)
        [ -f results/notebooks/manifest.json ] && args+=(--notebooks results/notebooks)
        uv run --frozen python scripts/gen_vv_site.py "${args[@]}"

    - name: Build site
      working-directory: site
      env:
        HUGO_ENVIRONMENT: production
      run: hugo --minify --panicOnWarning

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: site/public

  # Publish the site to GitHub Pages (main pushes only), and only when both
  # the tests and the notebooks succeeded, in this run or, for a page-only
  # push, in the successful main run whose results build-pages reused: a
  # failing run never replaces the live page. Requires Pages to be enabled
  # with "GitHub Actions" as the source (Settings -> Pages).
  deploy-pages:
    needs: [scope, vv-tests, notebooks, build-pages]
    if: ${{ !cancelled() && needs.build-pages.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' && ((needs.scope.outputs.recompute == 'true' && needs.vv-tests.result == 'success' && needs.notebooks.result == 'success') || (needs.scope.outputs.recompute == 'false' && needs.vv-tests.result == 'skipped' && needs.notebooks.result == 'skipped')) }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
