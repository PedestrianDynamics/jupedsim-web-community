# No-rebuild bring-up for the LLM/HTTP bridge.
#
# Three STOCK images, nothing built:
#   - viewer : the published all-in-one JuPedSim Web image (unmodified)
#   - proxy  : nginx that injects the Bridge button into the viewer's HTML
#              and strips CSP, so no custom viewer image is needed
#   - bridge : python:slim running the stdlib-only bridge_server.py by mount
#
# Usage:
#   docker compose -f docker/llm-bridge/nobuild/docker-compose.yml up
#   open http://localhost:8081/draw      # Bridge button already present
#
# The button talks to the bridge on 127.0.0.1:8090 (CORS is open on the bridge).

services:
  viewer:
    image: ${VIEWER_IMAGE:-jupedsim/jupedsim-web:latest}
    restart: unless-stopped
    volumes:
      - jupedsim-data:/data
    mem_limit: 4g
    # No published port: only the proxy talks to it.
    expose:
      - "8080"

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - viewer
    ports:
      - "8081:80"
    volumes:
      - ./proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
      # bridge-button.js ships with the bridge (parent dir). Served same-origin
      # by the proxy so the injected <script> is never blocked by script-src.
      - ../bridge-button-v14.js:/usr/share/nginx/bridge/bridge-button.js:ro

  bridge:
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../:/app:ro                 # mounts bridge_server.py (stdlib only)
      - bridge-runtime:/runtime     # writable scratch for results/state
    # 0.0.0.0 binds inside the container only, which Docker port-forwarding
    # requires; the host publish below stays loopback-only.
    command: ["python", "bridge_server.py", "--host", "0.0.0.0", "--port", "8090"]
    ports:
      - "127.0.0.1:8090:8090"       # host-only, matches the button's default

volumes:
  jupedsim-data:
  bridge-runtime:
