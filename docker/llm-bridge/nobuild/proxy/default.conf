# Reverse proxy in front of the STOCK viewer image.
# Job: inject the Bridge button into every HTML page and remove any CSP that
# would block the injected script or its cross-origin calls to the bridge.

server {
    listen 80;
    server_name _;

    # Serve the button same-origin so script-src can never block it.
    location = /__bridge/bridge-button.js {
        alias /usr/share/nginx/bridge/bridge-button.js;
        default_type application/javascript;
        add_header Cache-Control "no-store";
    }

    location / {
        proxy_pass http://viewer:8080;
        proxy_http_version 1.1;

        # WebSocket / live-update passthrough.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;

        # sub_filter cannot rewrite a compressed body — ask upstream for plain text.
        proxy_set_header Accept-Encoding "";

        # Drop any CSP so the injected <script> and its fetch() to :8090 are allowed.
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;

        # Inject the button just before </body>. sub_filter defaults to text/html.
        sub_filter_once on;
        sub_filter "</body>" "<script src=\"/__bridge/bridge-button.js\" defer></script></body>";
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
